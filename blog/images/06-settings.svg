<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <rect width="640" height="400" rx="16" fill="#fffcf6" stroke="#d8cdb6"/>
  <line x1="0" y1="56" x2="640" y2="56" stroke="#d8cdb6"/>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#2b2622">Keepr</text>
  <circle cx="608" cy="28" r="13" fill="none" stroke="#d8cdb6"/>
  <text x="608" y="33" font-size="13" text-anchor="middle" fill="#2b2622">&#9881;</text>

  <g transform="translate(180,0)">
    <text x="0" y="96" font-size="12" fill="#6f6557">Current folder</text>
    <text x="0" y="118" font-size="14" font-weight="700" fill="#2b2622">/Users/you/Desktop/trip-photos</text>

    <text x="0" y="156" font-size="12" fill="#6f6557">Switch to a different folder</text>
    <rect x="0" y="166" width="200" height="34" rx="7" fill="#f4efe4" stroke="#d8cdb6"/>
    <text x="12" y="188" font-size="12" fill="#6f6557">/Users/you/Desktop/some-folder</text>
    <rect x="208" y="166" width="62" height="34" rx="7" fill="#fffcf6" stroke="#d8cdb6"/>
    <text x="239" y="188" font-size="12" text-anchor="middle" fill="#2b2622">Switch</text>

    <text x="0" y="232" font-size="12" fill="#6f6557">Danger zone</text>
    <rect x="0" y="242" width="228" height="34" rx="17" fill="#fffcf6" stroke="#8a3320"/>
    <text x="114" y="264" font-size="12" text-anchor="middle" fill="#8a3320">Reset progress for this folder</text>
  </g>

  <text x="320" y="352" font-size="13" text-anchor="middle" fill="#6f6557">Recent folders show up here too, once you&#8217;ve switched between a few.</text>
</svg>
