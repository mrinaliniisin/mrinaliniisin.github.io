<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- /support is an alias of /contact. GitHub Pages cannot send a 301, so
       this is a client-side redirect: the meta refresh fires immediately,
       the canonical tells search engines which URL is the real one, and the
       link below is the fallback for anything that ignores both. -->
  <meta http-equiv="refresh" content="0; url=/contact">
  <link rel="canonical" href="https://mrinaliniisin.github.io/contact">
  <title>Support · Mrinalini S</title>
</head>
<body>
  <p>Redirecting to <a href="/contact">/contact</a>&hellip;</p>
</body>
</html>
