<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog editor</title>
  <link rel="stylesheet" href="/assets/blog.css">
  <style>
    /* Editor chrome — only loaded locally, never part of a published post. */
    body { padding: 0; }
    /* Two views on one page. The dashboard scrolls like any page; the editor
       pins its panes to the viewport so the Markdown and preview scroll on
       their own, under the fixed header and toolbar. */
    body.editing { height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    #editor { flex: 1; display: flex; flex-direction: column; min-height: 0; }

    /* New post: a floating + in the bottom-right corner, on both views. */
    .fab { position: fixed; right: 24px; bottom: 24px; z-index: 20;
           width: 56px; height: 56px; border-radius: 50%;
           display: flex; align-items: center; justify-content: center;
           background: #2d5a27; color: #fff; text-decoration: none;
           font-size: 30px; line-height: 1; font-weight: 400;
           box-shadow: 0 4px 14px rgba(0,0,0,.28);
           transition: filter .12s, transform .12s; }
    .fab:hover { filter: brightness(1.12); transform: translateY(-1px); }

    /* Dashboard: every post, draft and page as a card, in the shape the blog
       listing uses (white, hairline border, lift on hover) so a card here
       looks like the card it becomes on the blog page. */
    .home { max-width: 1080px; margin: 0 auto; padding: 36px 24px 64px; }
    .home-head { display: flex; align-items: baseline; gap: 14px; }
    .home h1 { font-size: 26px; }
    .home h2.sec { font-size: 12px; font-weight: 600; letter-spacing: 0.07em;
                   text-transform: uppercase; color: #6b6560; margin: 36px 0 12px; }
    .home-head { margin-bottom: 20px; }
    /* Dashed, like the drafts' own cards and the blog page's own divider. */
    .sec-divider { border: 0; border-top: 1px dashed #c9c5bc; margin: 40px 0 0; }
    .sec-divider + h2.sec { margin-top: 28px; }
    .ecards { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }
    .ecard { position: relative; background: #fff; border: 1px solid #e3e0d9; border-radius: 12px;
             padding: 16px 18px; transition: transform 0.15s ease, box-shadow 0.15s ease,
             border-color 0.15s ease; }
    .ecard:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,0.06);
                   border-color: #2d5a27; }
    .ecard.draft { border-style: dashed; }
    .ecard.orphan { border-style: dashed; border-color: #d9b64a; background: #fffdf4; }
    .ecard.empty { color: #6b6560; border-style: dashed; font-size: 14px; }
    .ecard.empty:hover { transform: none; box-shadow: none; border-color: #e3e0d9; }
    /* One big click target, as on the blog page. */
    .ecard-link { position: absolute; inset: 0; z-index: 1; border-radius: inherit; }
    .ecard h2 { font-size: 17px; font-weight: 600; line-height: 1.3; margin: 0 0 4px; }
    .badges + h2 { margin-top: 8px; }
    .ecard:hover h2 { color: #2d5a27; }
    .ecard.orphan h2 { color: #6b6560; }
    .ecard-meta { font-size: 12.5px; color: #a8a29e; }
    .ecard-progress { margin-top: 6px; color: #6b6560; }
    .ecard-progress:first-of-type { margin-top: 0; }
    .ecard .post-tags { margin-top: 10px; }
    /* Feed cards (YouTube Likes): the card still opens the page, but its
       controls sit above the stretched link so the button stays clickable —
       same layering trick as the source-link on index.html's cards. */
    .feed-actions { position: relative; z-index: 2; display: flex; gap: 10px;
                    align-items: center; margin-top: 12px; }
    .feed-actions button { font: inherit; font-size: 12px; border: 1px solid #d9d6cf;
                           background: #f7f6f3; color: #1a1a1a; border-radius: 6px;
                           padding: 5px 10px; cursor: pointer; }
    .feed-actions button:hover { filter: brightness(0.97); }
    .feed-actions button:disabled { opacity: .55; cursor: default; }
    .feed-actions .feed-msg { font-size: 12px; color: #6b6560; }
    .feed-actions .feed-msg.err { color: #8a2a1e; }
    .badge.err { background: #f8dcd7; color: #8a2a1e; }
    .badge.off { background: #f3e8c7; color: #7a5c00; }
    .badges { display: flex; gap: 6px; flex-wrap: wrap; }
    .badge { font-size: 10.5px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase;
             line-height: 1.6; padding: 0 7px; border-radius: 999px; background: #ebe9e4; color: #6b6560; }
    .badge.draft { background: #f3e8c7; color: #7a5c00; }
    .badge.unpushed { background: #e2ecdd; color: #2d5a27; }
    .badge.orphan { background: #f8dcd7; color: #8a2a1e; }

    /* Footer: the site's links, then the blog's numbers, on both views. Under
       the editor the panes take the remaining height, so the footer must not
       grow or shrink. */
    footer.stats { flex: none; max-width: none; margin: 0; padding: 10px 20px;
                   display: flex; align-items: center; justify-content: center;
                   gap: 22px; flex-wrap: wrap;
                   border-top: 1px solid #e3e0d9; background: #f4f3f0;
                   font-size: 12px; color: #a8a29e; text-align: center; }
    footer.stats b { color: #6b6560; font-weight: 600; }
    .footnav { display: flex; gap: 16px; padding-right: 22px; border-right: 1px solid #d9d6cf; }
    .footnav a { color: #2d5a27; font-size: 13px; text-decoration: none; }
    .footnav a:hover { text-decoration: underline; }
    /* The dashboard is a page: give its footer room, and let the gap between
       links and numbers collapse to a plain row on narrow screens. */
    @media (max-width: 720px) { .footnav { padding-right: 0; border-right: 0; } }

    .bar { position: sticky; top: 0; z-index: 10; display: flex; gap: 12px;
           align-items: center; flex-wrap: wrap;
           background: #1a1a1a; color: #fff; padding: 12px 20px; }
    .bar input { font: inherit; border: 1px solid #444; border-radius: 6px;
                 background: #2a2a2a; color: #fff; padding: 7px 10px; }
    .bar input.title { flex: 1; min-width: 220px; font-size: 15px; font-weight: 600; }
    .bar select { font: inherit; border: 1px solid #444; border-radius: 6px;
                  background: #2a2a2a; color: #fff; padding: 7px 10px; max-width: 240px; }
    .bar label.toggle { display: inline-flex; align-items: center; gap: 6px;
                        font-size: 13px; color: #d8d4cd; cursor: pointer; user-select: none; }
    .bar label.toggle input { width: 15px; height: 15px; accent-color: #2d5a27; cursor: pointer; }
    .bar button { font: inherit; background: #2d5a27; color: #fff; border: 0;
                  border-radius: 6px; padding: 8px 16px; font-weight: 600; cursor: pointer; }
    .bar button:hover { filter: brightness(1.12); }
    .bar button.danger { background: #7a2222; }
    .bar button[hidden] { display: none; }
    /* Tag field: chips + a type-ahead that offers the tags already in use.
       Chips are drawn in the same shape and hue as the ribbons they'll become
       on the blog page, so the colour isn't a surprise after saving. */
    .tagfield { position: relative; display: flex; align-items: center; gap: 5px;
                flex-wrap: wrap; flex: 1 1 210px; min-width: 170px; max-width: 340px;
                border: 1px solid #444; border-radius: 6px; background: #2a2a2a;
                padding: 3px 5px; }
    .tagfield #chips { display: contents; }
    .tagfield input { flex: 1; min-width: 72px; border: 0; background: transparent;
                      padding: 4px 4px; font-size: 13px; }
    .tagfield input:focus { outline: none; }
    .chip { display: inline-flex; align-items: center; gap: 4px;
            background: hsl(var(--rb, 100) 38% 39%); color: #fff;
            font-size: 11.5px; font-weight: 600; line-height: 1.5;
            padding: 2px 13px 2px 7px;
            clip-path: polygon(0 0, 100% 0, calc(100% - 5px) 50%, 100% 100%, 0 100%); }
    .chip .x { cursor: pointer; opacity: 0.65; font-weight: 700; }
    .chip .x:hover { opacity: 1; }
    .tagmenu { position: absolute; top: calc(100% + 6px); left: 0; z-index: 30;
               min-width: 100%; max-height: 240px; overflow-y: auto; padding: 4px;
               background: #232323; border: 1px solid #444; border-radius: 8px;
               box-shadow: 0 10px 30px rgba(0,0,0,0.45); }
    .tagmenu[hidden] { display: none; }
    .tagmenu button { display: flex; width: 100%; align-items: center; gap: 8px;
                      background: transparent; color: #e8e6e1; border: 0;
                      border-radius: 6px; padding: 6px 8px;
                      font: inherit; font-size: 13px; font-weight: 400;
                      text-align: left; cursor: pointer; white-space: nowrap; }
    .tagmenu button:hover, .tagmenu button.on { background: #3a3a3a; filter: none; }
    .tagmenu .sw { flex: none; width: 10px; height: 10px; border-radius: 2px;
                   background: hsl(var(--rb, 100) 38% 44%); }
    .tagmenu .n { margin-left: auto; padding-left: 10px; color: #8a847e; font-size: 11px; }
    .bar .status { font-size: 13px; color: #a8a29e; }
    .bar code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
                font-size: 0.92em; background: #2a2a2a; color: #e8e6e1;
                padding: 1px 6px; border-radius: 4px; }
    .bar .status a { color: #8fd17f; }
    .panes { display: grid; grid-template-columns: 1fr 1fr; gap: 0; flex: 1; min-height: 0; }
    .panes textarea { border: 0; border-right: 1px solid #d9d6cf; padding: 32px 24px;
                      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
                      font-size: 14px; line-height: 1.6; resize: none; outline: none;
                      background: #fbfaf8; color: #1a1a1a; }
    .preview { overflow-y: auto; padding: 24px; }
    .preview .wrap { padding: 8px 0; }
    @media (max-width: 720px) { body.editing { height: auto; overflow: auto; }
                                .panes { grid-template-columns: 1fr; }
                                .panes textarea { min-height: 50vh; } }
  </style>
</head>
<body>
  <section class="home" id="home" hidden>
    <div class="home-head">
      <h1>Mrinalini’s blog</h1>
    </div>
    <div id="homebody"></div>
  </section>

  <section id="editor" hidden>
  <div class="bar">
    <input class="title" id="title" placeholder="Post title" autocomplete="off">
    <input type="date" id="date">
    <label class="toggle" title="Save as a standalone page (linked from Home) instead of a dated blog post">
      <input type="checkbox" id="ispage"> Page
    </label>
    <label class="toggle" id="draftlabel"
           title="List this post as &quot;Coming soon&quot; instead of publishing it: the card shows on the blog page with the bell prompt, but doesn't link to the post yet.">
      <input type="checkbox" id="isdraft"> Draft
    </label>
    <label class="toggle" id="layoutlabel"
           title="Standard: one centred column, text and images in a single flow. Gallery: text on the left, every image lifted out into a column of cards on the right. A card's caption is the line written directly under the image (no blank line between), or else the image's alt text.">
      Layout
      <select id="layout" aria-label="Post layout">
        <option value="standard">Standard</option>
        <option value="gallery">Gallery</option>
      </select>
    </label>
    <div class="tagfield" id="tagfield"
         title="Tags for this post. They show as ribbons on the post and on its card on the blog page.">
      <span id="chips"></span>
      <input id="tagin" placeholder="Tag…" autocomplete="off" spellcheck="false"
             aria-label="Add a tag" role="combobox" aria-expanded="false" aria-autocomplete="list">
      <div class="tagmenu" id="tagmenu" hidden role="listbox" aria-label="Existing tags"></div>
    </div>
    <button id="save">Save</button>
    <button id="del" class="danger" hidden
            title="Delete this post's file and its card from the blog listing">Delete</button>
    <span class="status" id="status">Unsaved &middot; Save writes to /blog, then <code>git push</code> to publish</span>
  </div>
  <div class="panes">
    <textarea id="md" placeholder="# Write your post in Markdown&#10;&#10;Type here…"></textarea>
    <div class="preview">
      <div class="wrap"><div class="post-body" id="preview"></div></div>
    </div>
  </div>
  </section>

  <footer class="stats">
    <nav class="footnav" aria-label="Site tools">
      <a href="/editor.html" title="All posts, drafts and pages">Editor</a>
      <a href="/blog/" title="The blog listing served from this machine — includes what isn't pushed yet">Local version</a>
      <a href="https://mrinaliniisin.github.io" target="_blank" rel="noopener" title="The published site, as the world sees it">Live Blog</a>
      <a href="/gallery.html">Gallery</a>
    </nav>
    <span id="stats"></span>
  </footer>

  <a class="fab" href="/editor.html?new=1" title="New post" aria-label="New post">+</a>

  <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
  <!-- The other direction: HTML -> Markdown, for pasting. Same CDN as marked. -->
  <script src="https://cdn.jsdelivr.net/npm/turndown@7/dist/turndown.min.js"></script>
  <script>
    const $ = id => document.getElementById(id);

    // A YouTube link on its own line becomes a responsive inline player. This
    // runs before marked so the URL isn't autolinked first; marked then passes
    // the <div> through as a raw HTML block. The Markdown source keeps the
    // plain URL, so posts reload and re-render cleanly.
    const YT_ID = /(?:youtube\.com\/(?:watch\?(?:\S*&)?v=|shorts\/|embed\/)|youtu\.be\/)([\w-]{11})/;
    // Pull a start time out of the link so a deep-linked moment survives:
    // t=90, t=90s, or t=1m30s / t=1h2m3s, plus the embed's own ?start=. -> seconds.
    const ytStart = url => {
      const m = url.match(/[?&](?:t|start)=([0-9hms]+)/i);
      if (!m) return 0;
      if (/^\d+$/.test(m[1])) return +m[1];          // plain seconds
      let s = 0, p; const re = /(\d+)([hms])/gi;
      while ((p = re.exec(m[1]))) s += +p[1] * { h: 3600, m: 60, s: 1 }[p[2].toLowerCase()];
      return s;
    };
    const ytEmbed = (id, start) =>
      '<div class="video-embed"><iframe src="https://www.youtube-nocookie.com/embed/' + id +
      (start ? '?start=' + start : '') +
      '" title="YouTube video" loading="lazy" allow="accelerometer; autoplay; clipboard-write; ' +
      'encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe></div>';
    const embedYouTube = md => (md || '').replace(
      /^[ \t]*(?:https?:\/\/)?(?:www\.)?(?:youtube\.com\/(?:watch\?(?:\S*&)?v=|shorts\/|embed\/)|youtu\.be\/)([\w-]{11})\S*[ \t]*$/gm,
      (m, id) => '\n\n' + ytEmbed(id, ytStart(m)) + '\n\n');

    // ---- Pasting HTML ------------------------------------------------------
    // A textarea paste takes the clipboard's text/plain flavour, so copying the
    // *source* of a page drops raw markup into the Markdown pane — tags and all,
    // right down to the </body></html>. Left alone that's not just ugly: marked
    // passes raw HTML straight through, so saving it would bury a second
    // <footer> and stray closing tags inside the post body. So: spot HTML on the
    // way in and turn it back into Markdown.

    const turndown = window.TurndownService && new TurndownService({
      headingStyle: 'atx',            // ## Heading, matching how posts are written
      codeBlockStyle: 'fenced',
      bulletListMarker: '-',
      emDelimiter: '*',
    });
    // A post's video embed is an <iframe> in the HTML but a bare URL in the
    // Markdown (see embedYouTube), so send it back the way it came instead of
    // letting Turndown drop the iframe on the floor.
    if (turndown) turndown.addRule('youtubeEmbed', {
      filter: n => n.nodeName === 'IFRAME' && /youtube(?:-nocookie)?\.com\/embed\//.test(n.getAttribute('src') || ''),
      replacement: (_, node) => {
        const m = (node.getAttribute('src') || '').match(/embed\/([\w-]{11})/);
        return m ? '\n\nhttps://www.youtube.com/watch?v=' + m[1] + '\n\n' : '';
      },
    });

    // Is this text actually markup, rather than prose that happens to contain a
    // tag? Deliberately strict: a whole document is obvious, and short of that
    // we want it to both START with a tag and carry real block structure, so a
    // Markdown draft with one raw <div class="video-embed"> in it isn't dragged
    // through a conversion it doesn't need.
    const HTML_DOC = /<!DOCTYPE\s+html|<html[\s>]|<\/body>|<\/html>/i;
    const BLOCK_TAG = /<(?:p|div|h[1-6]|ul|ol|li|blockquote|pre|table|article|section|main|figure)\b[^>]*>/gi;
    const blockCount = t => (t.match(BLOCK_TAG) || []).length;
    const looksLikeHtml = t => HTML_DOC.test(t) || (/^\s*</.test(t) && blockCount(t) >= 2);
    // Markdown markers. If the plain text already reads as Markdown we leave it
    // alone, so copying Markdown out of a code block on some page doesn't come
    // back wrapped in a fence.
    const looksLikeMarkdown = t => /(?:^|\n)#{1,6}\s|\]\(|(?:^|\n)[-*]\s+\S|\*\*\S/.test(t);

    const b64ToText = b64 =>
      new TextDecoder().decode(Uint8Array.from(atob(b64.trim()), c => c.charCodeAt(0)));

    // Returns { markdown, exact } or null if there's nothing better to offer.
    function htmlToMarkdown(html) {
      // Every post and page on this site carries its own Markdown source inside
      // an <!--EDIT:…:b64:…--> comment, so if this is one of ours we can hand
      // back the author's exact original rather than a reconstruction of it.
      const m = html.match(/<!--EDIT:[^:]*:b64:([\s\S]*?)-->/);
      if (m) {
        try { return { markdown: b64ToText(m[1]), exact: true }; } catch (err) { /* fall through */ }
      }
      if (!turndown) return null;              // CDN blocked or offline
      const doc = new DOMParser().parseFromString(html, 'text/html');
      // Page chrome, not content — this is the stuff that would otherwise end up
      // duplicated inside the post body.
      doc.querySelectorAll('script, style, nav, footer, header, .back, .top-actions, .post-meta, .fab')
         .forEach(n => n.remove());
      // Prefer the narrowest wrapper that means "the writing": a post body, then
      // an article, then main, and only then the whole document.
      const root = doc.querySelector('.post-body') || doc.querySelector('article') ||
                   doc.querySelector('main') || doc.body;
      if (!root) return null;
      const h1 = root.querySelector('h1');     // the title field supplies this
      if (h1) h1.remove();
      const markdown = turndown.turndown(root.innerHTML).trim();
      return markdown ? { markdown, exact: false } : null;
    }

    // The title field supplies the post's <h1>, so drop a leading body heading
    // to keep preview, published post, and listing showing the title once.
    const toBody = md => marked.parse(embedYouTube(md))
                          .replace(/^\s*<h1\b[^>]*>.*?<\/h1>\s*/is, '');
    const render = () => { $('preview').innerHTML = toBody($('md').value); };
    $('date').value = new Date().toISOString().slice(0, 10);

    // Track unsaved edits so the "New post" button can warn before discarding.
    let dirty = false;
    const markDirty = () => { dirty = true; };
    $('md').addEventListener('input', () => { render(); markDirty(); });
    $('title').addEventListener('input', markDirty);
    $('date').addEventListener('input', markDirty);

    // Paste an image: upload its bytes to the server, then drop a Markdown
    // image reference at the caret. A placeholder holds the spot while the
    // upload is in flight so two quick pastes can't clobber each other.
    const blobToB64 = blob => new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onload = () => resolve(r.result.split(',', 2)[1]); // strip "data:…;base64,"
      r.onerror = reject;
      r.readAsDataURL(blob);
    });
    const insertAtCursor = (ta, text) => {
      const { selectionStart: s, selectionEnd: e } = ta;
      ta.value = ta.value.slice(0, s) + text + ta.value.slice(e);
      ta.selectionStart = ta.selectionEnd = s + text.length;
    };
    let pasteSeq = 0;
    $('md').addEventListener('paste', async e => {
      const item = [...(e.clipboardData?.items || [])]
                     .find(it => it.type.startsWith('image/'));
      if (!item) {
        const text = (e.clipboardData?.getData('text/plain') || '').trim();
        // A pasted YouTube link (and nothing else) drops in as an inline player.
        // Requiring the whole clipboard to be the URL leaves links inside copied
        // prose untouched; the blank lines put it on its own block for the embed.
        if (/^\S+$/.test(text) && YT_ID.test(text)) {
          e.preventDefault();
          insertAtCursor($('md'), '\n\n' + text + '\n\n');
          render(); markDirty();
          return;
        }
        // Two ways HTML arrives. Either the plain text IS markup (you copied a
        // page's source), or the clipboard carries a text/html flavour alongside
        // it (you copied from a rendered page). The first is always worth
        // converting; the second only when it has structure worth keeping and
        // the plain text isn't already Markdown.
        const rich = e.clipboardData?.getData('text/html') || '';
        const source = looksLikeHtml(text) ? text
                     : (rich && blockCount(rich) >= 1 && !looksLikeMarkdown(text)) ? rich
                     : '';
        if (source) {
          const got = htmlToMarkdown(source);
          if (got) {
            e.preventDefault();
            insertAtCursor($('md'), got.markdown);
            render(); markDirty();
            $('status').textContent = got.exact
              ? 'Pasted HTML was one of your own posts — restored its original Markdown.'
              : 'Pasted HTML converted to Markdown.';
          } else if (!turndown) {
            // Nothing to convert with, so the raw markup is about to land in the
            // pane. Say so rather than letting it look like the editor broke.
            $('status').textContent =
              'That looks like HTML, but the Markdown converter didn\'t load — ' +
              'check your connection, or clean the tags up by hand before saving.';
          }
        }
        return;                     // otherwise let the normal text paste run
      }
      e.preventDefault();
      const file = item.getAsFile();
      if (!file) return;
      const token = '![uploading #' + (++pasteSeq) + '…]()';
      insertAtCursor($('md'), token);
      render(); markDirty();
      try {
        const b64 = await blobToB64(file);
        const r = await fetch('/api/upload', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title: $('title').value.trim(),
                                 mime: file.type, b64 })
        });
        const d = await r.json();
        if (!r.ok) throw new Error(d.error || r.status);
        $('md').value = $('md').value.replace(token, '![](' + d.url + ')');
        $('status').textContent = 'Inserted ' + d.url; // clear any stale error
      } catch (err) {
        $('md').value = $('md').value.replace(token, '');
        $('status').textContent = 'Image upload failed: ' + err.message;
      }
      render();
    });

    // The editor handles two kinds of document:
    //   post — a dated blog entry in /blog/, listed on the blog index
    //   page — a standalone markdown page at the repo root, linked from Home
    // The "Page" toggle picks the kind for a NEW doc; opening an existing one
    // sets it from the URL. currentSlug keeps an opened page's filename
    // stable across re-saves, so its homepage link doesn't break.
    let currentKind = 'post';
    let currentSlug = '';
    // An orphaned listing card is open: a card on the blog page whose post file
    // is gone (see server.py's _prune_cards). There's nothing to edit — it's
    // open only so Delete can clear the card — so Save has to refuse, or it
    // would resurrect the post as an empty one under the same title.
    let currentOrphan = false;

    // Delete only offers itself for a post that's already on disk, or for an
    // orphaned card. A fresh draft has no file yet, and a page's file is
    // deleted from the homepage's edit-mode trash instead — that path also
    // removes the page's homepage card and the links pointing at it, which this
    // one knows nothing about.
    const canDelete = () => currentKind === 'post' && !!currentSlug;
    const syncDelete = () => { $('del').hidden = !canDelete(); };

    function setKind(kind) {
      currentKind = kind;
      $('ispage').checked = (kind === 'page');
      $('date').style.display = (kind === 'page') ? 'none' : '';
      // Only posts get a listing card, so only posts can be drafts. Pages are
      // linked from Home by hand and were never on the blog listing at all.
      $('draftlabel').style.display = (kind === 'page') ? 'none' : '';
      // Tags exist to be shown on the blog listing, and a page has no card
      // there — so, like Draft, the field is a post-only affair.
      $('tagfield').style.display = (kind === 'page') ? 'none' : '';
      // Layout is a post affair too: the gallery split is done by write_post,
      // and a page goes through write_md_page, which knows only one shape.
      $('layoutlabel').style.display = (kind === 'page') ? 'none' : '';
      if (kind === 'page') { $('isdraft').checked = false; setTags([]); $('layout').value = 'standard'; }
      syncDelete();
    }

    const api = async (path, body) => {
      const r = await fetch(path, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      const d = await r.json();
      if (!r.ok) throw new Error(d.error || r.status);
      return d;
    };

    $('ispage').addEventListener('change', () => {
      setKind($('ispage').checked ? 'page' : 'post');
      markDirty();
    });

    $('isdraft').addEventListener('change', markDirty);
    $('layout').addEventListener('change', markDirty);

    // ---- Tags -----------------------------------------------------------
    // The post's tags, and the vocabulary to pick from: every tag already in
    // use across the blog, with its post count, from /api/tags. Server-side a
    // post's tags are one <meta name="post-tags"> line in its own file and
    // there's no registry anywhere, so "existing tags" is nothing more than
    // what the other posts happen to use.
    let tags = [];
    let known = [];          // [{name, count, hue}], most-used first
    let hi = -1;             // highlighted row in the suggestion menu

    // Same hue-from-name hash as server.py's tag_hue, so a chip here is exactly
    // the colour the ribbon will be. crc32 over UTF-8 bytes to match zlib's.
    const TAG_HUES = [152, 186, 210, 250, 282, 320, 348, 18, 38, 92];
    const CRC = (() => { const t = new Int32Array(256);
      for (let n = 0; n < 256; n++) { let c = n;
        for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
        t[n] = c; } return t; })();
    const tagHue = name => {
      let c = -1;
      for (const b of new TextEncoder().encode(name.toLowerCase()))
        c = (c >>> 8) ^ CRC[(c ^ b) & 0xFF];
      return TAG_HUES[((c ^ -1) >>> 0) % TAG_HUES.length];
    };

    // Mirrors parse_tags in server.py: commas are the separator in the stored
    // meta line, so they can't survive inside a tag.
    const cleanTag = raw => raw.replace(/,/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 32).trim();
    const hasTag = name => tags.some(t => t.toLowerCase() === name.toLowerCase());

    function renderChips() {
      $('chips').innerHTML = '';
      for (const t of tags) {
        const chip = document.createElement('span');
        chip.className = 'chip';
        chip.style.setProperty('--rb', tagHue(t));
        chip.append(t);
        const x = document.createElement('span');
        x.className = 'x'; x.textContent = '\u00d7';
        x.title = 'Remove "' + t + '"';
        x.addEventListener('click', () => { removeTag(t); markDirty(); });
        chip.appendChild(x);
        $('chips').appendChild(chip);
      }
    }

    function setTags(list) { tags = []; for (const t of list || []) pushTag(t); renderChips(); }
    function removeTag(name) {
      tags = tags.filter(t => t !== name);
      renderChips();
    }

    // Adopt an existing tag's spelling when one matches case-insensitively:
    // typing "books" where "Books" is already in use should reuse that tag
    // rather than fork the vocabulary into two that render as one.
    function pushTag(raw) {
      const name = cleanTag(raw);
      if (!name || hasTag(name)) return false;
      const match = known.find(k => k.name.toLowerCase() === name.toLowerCase());
      tags.push(match ? match.name : name);
      return true;
    }

    function addTag(raw) {
      if (pushTag(raw)) { renderChips(); markDirty(); }
      $('tagin').value = '';
      showMenu();
    }

    // The suggestion list: existing tags not already on this post, filtered by
    // what's typed, then an explicit "create" row when the text isn't one of
    // them — so inventing a tag is a visible choice rather than something that
    // silently happens on Enter.
    //
    // Existing tags come FIRST, and the first row is the one Enter takes.
    // Typing "relat" should land on "Relationships", not mint a "relat" beside
    // it: a tag that's one keystroke off an existing one is nearly always a
    // typo, and the failure is invisible — two ribbons that mean the same
    // thing. Creating still works, it's just one ArrowDown away. Within the
    // matches, tags that START with what's typed rank above ones that merely
    // contain it, so the row Enter would take is the likeliest one.
    function menuItems() {
      const typed = cleanTag($('tagin').value);
      const q = typed.toLowerCase();
      const items = known
        .filter(k => !hasTag(k.name) && (!q || k.name.toLowerCase().includes(q)))
        .map(k => ({ name: k.name, hue: k.hue, count: k.count,
                     lead: q && k.name.toLowerCase().startsWith(q) ? 0 : 1 }))
        .sort((a, b) => a.lead - b.lead);   // stable, so /api/tags' own order holds within a group
      if (typed && !hasTag(typed) &&
          !items.some(i => i.name.toLowerCase() === q))
        items.push({ name: typed, hue: tagHue(typed), create: true });
      return items;
    }

    function showMenu() {
      const items = menuItems();
      const menu = $('tagmenu');
      menu.innerHTML = '';
      hi = items.length ? 0 : -1;
      items.forEach((it, i) => {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = i === hi ? 'on' : '';
        b.dataset.name = it.name;
        b.innerHTML = '<span class="sw" style="--rb:' + it.hue + '"></span>';
        b.append(it.create ? 'Create \u201c' + it.name + '\u201d' : it.name);
        if (!it.create) {
          const n = document.createElement('span');
          n.className = 'n'; n.textContent = it.count + (it.count === 1 ? ' post' : ' posts');
          b.appendChild(n);
        }
        // mousedown, not click: the input would blur first and close the menu.
        b.addEventListener('mousedown', e => { e.preventDefault(); addTag(it.name); });
        menu.appendChild(b);
      });
      menu.hidden = !items.length;
      $('tagin').setAttribute('aria-expanded', String(!menu.hidden));
    }

    const hideMenu = () => { $('tagmenu').hidden = true; hi = -1;
                             $('tagin').setAttribute('aria-expanded', 'false'); };

    function moveHi(delta) {
      const rows = [...$('tagmenu').querySelectorAll('button')];
      if (!rows.length) return;
      rows[hi]?.classList.remove('on');
      hi = (hi + delta + rows.length) % rows.length;
      rows[hi].classList.add('on');
      rows[hi].scrollIntoView({ block: 'nearest' });
    }

    $('tagin').addEventListener('input', showMenu);
    $('tagin').addEventListener('focus', showMenu);
    $('tagin').addEventListener('blur', hideMenu);
    $('tagin').addEventListener('keydown', e => {
      const rows = [...$('tagmenu').querySelectorAll('button')];
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        e.preventDefault(); if ($('tagmenu').hidden) showMenu(); else moveHi(e.key === 'ArrowDown' ? 1 : -1);
      } else if (e.key === 'Enter' || e.key === ',') {
        // Deliberately not Tab. Tab commits in some tag fields, but here the
        // menu pre-selects the nearest existing tag, so tabbing out towards
        // Save would quietly attach a tag that was never chosen.
        const pick = (!$('tagmenu').hidden && rows[hi]) ? rows[hi].dataset.name : cleanTag(e.target.value);
        if (!pick) return;
        e.preventDefault();
        addTag(pick);
      } else if (e.key === 'Escape' && !$('tagmenu').hidden) {
        e.preventDefault(); hideMenu();
      } else if (e.key === 'Backspace' && !e.target.value && tags.length) {
        removeTag(tags[tags.length - 1]); markDirty(); showMenu();
      }
    });

    // Clicking the field's padding should get you to the input, like a real
    // multi-value control — but not when the click was a chip's \u00d7.
    $('tagfield').addEventListener('mousedown', e => {
      if (e.target === $('tagfield') || e.target === $('chips')) {
        e.preventDefault(); $('tagin').focus();
      }
    });

    const loadKnownTags = () => fetch('/api/tags')
      .then(r => r.json()).then(d => { known = d.tags || []; })
      .catch(() => {});
    loadKnownTags();

    // Open an orphaned card. There's no file behind it, so there's nothing to
    // fetch and nothing to edit — show what the card says and point at Delete,
    // the one action that applies.
    function openOrphan(slug, title, listed) {
      currentSlug = slug;                 // before setKind, which reads it
      currentOrphan = true;
      setKind('post');
      $('isdraft').checked = false;
      setTags([]);
      $('layout').value = 'standard';
      $('title').value = title || slug;
      $('date').value = '';
      $('md').value = '';
      render(); dirty = false;
      $('status').innerHTML =
        'Orphaned card &middot; <code>blog/' + slug + '.html</code> is gone, but the blog ' +
        'listing still shows a card for it' + (listed ? ' dated ' + listed : '') +
        ' &mdash; where it reads as an unpublished post. <b>Delete</b> removes the card.';
      history.replaceState(null, '', '?p=' + slug);
    }

    // Load an existing post or page, from the URL.
    function loadDoc(kind, slug, push) {
      const api = kind === 'page' ? '/api/md-page?p=' : '/api/load?p=';
      return fetch(api + encodeURIComponent(slug))
        .then(r => r.ok ? r.json() : Promise.reject())
        .then(p => {
          currentSlug = p.slug || slug;   // before setKind, which reads it
          currentOrphan = false;
          setKind(kind);                  // clears the draft box, so set it after
          $('isdraft').checked = (kind === 'post' && !!p.draft);
          $('layout').value = (kind === 'post' && p.layout) || 'standard';
          setTags(kind === 'post' ? p.tags : []);
          $('title').value = p.title;
          if (kind === 'post') $('date').value = p.date || $('date').value;
          $('md').value = p.markdown;
          render(); dirty = false;
          $('status').textContent = 'Editing ' + (kind === 'page' ? 'page ' : '') + slug +
                                    ($('isdraft').checked ? ' (draft — listed as “Coming soon”)' : '');
          if (push) history.replaceState(null, '', '?' + (kind === 'page' ? 'page' : 'p') + '=' + slug);
        })
        .catch(() => { $('status').textContent = 'Could not load "' + slug + '"'; });
    }

    // ---- Views -------------------------------------------------------------
    // One page, two views. /editor.html on its own is the dashboard: every
    // post, draft and page as a card. ?p=<slug>, ?page=<slug> and ?new open
    // the editor. Cards are plain links, so opening one is a page load and
    // the editor always starts clean.
    const params = new URLSearchParams(location.search);
    const route = params.get('page') ? 'page' : params.get('p') ? 'post'
                : params.has('new') ? 'new' : 'home';

    const listAll = () => Promise.all([
      fetch('/api/posts').then(r => r.json()).catch(() => ({ posts: [] })),
      fetch('/api/md-pages').then(r => r.json()).catch(() => ({ pages: [] })),
      // Which posts exist on disk but aren't committed — the ones whose card
      // on the blog page currently reads "coming soon".
      fetch('/api/blog-status').then(r => r.json()).catch(() => ({ uncommitted: [] })),
    ]).then(([P, G, S]) => ({ posts: P.posts || [], pages: G.pages || [],
                              unpushed: new Set(S.uncommitted || []) }));

    const esc = v => String(v).replace(/[&<>"]/g,
      c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    const humanDate = iso => {
      const d = new Date(iso + 'T00:00:00');       // local midnight, not UTC's
      return isNaN(d) ? iso : d.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
    };
    // "just now", "20 minutes ago", "yesterday", "3 days ago" — and past a
    // month, the plain date, which reads better than "47 days ago".
    const ago = iso => {
      const then = new Date(iso); if (isNaN(then)) return '';
      const s = Math.max(0, (Date.now() - then) / 1000);
      const m = s / 60, h = m / 60, d = h / 24;
      if (s < 60) return 'just now';
      if (m < 60) return Math.round(m) + (Math.round(m) === 1 ? ' minute ago' : ' minutes ago');
      if (h < 24) return Math.round(h) + (Math.round(h) === 1 ? ' hour ago' : ' hours ago');
      if (d < 2) return 'yesterday';
      if (d < 31) return Math.round(d) + ' days ago';
      return 'on ' + then.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
    };

    function card(p, kind, unpushed) {
      const badges = [];
      if (p.orphan) badges.push('<span class="badge orphan">Orphaned card</span>');
      if (p.draft) badges.push('<span class="badge draft">Draft</span>');
      if (kind === 'post' && !p.orphan && !p.draft && unpushed.has('/blog/' + p.slug + '.html'))
        badges.push('<span class="badge unpushed">Not pushed</span>');
      if (p.layout === 'gallery') badges.push('<span class="badge">Gallery</span>');
      const open = (kind === 'page' ? '?page=' : '?p=') + encodeURIComponent(p.slug);
      // A draft's date is only what it will be published under, so it's
      // noise here; the Edited line below says what matters for a draft.
      const meta = p.orphan ? (p.listed ? 'card dated ' + esc(p.listed) : 'no file behind it')
                 : kind === 'page' ? esc(p.slug) + '.html'
                 : p.draft ? ''
                 : (p.date ? humanDate(p.date) : '');
      const tags = (p.tags || []).map(t =>
        '<span class="tag-ribbon" style="--rb:' + tagHue(t) + '">' + esc(t) + '</span>').join('');
      return '<div class="ecard' + (p.draft ? ' draft' : '') + (p.orphan ? ' orphan' : '') + '">' +
        '<a class="ecard-link" href="' + open + '" aria-label="' +
          (p.orphan ? 'Open orphaned card ' : 'Edit ') + esc(p.title) + '"></a>' +
        (badges.length ? '<div class="badges">' + badges.join('') + '</div>' : '') +
        '<h2>' + esc(p.title) + '</h2>' +
        (meta ? '<div class="ecard-meta">' + meta + '</div>' : '') +
        // When it was last touched — for a draft (work in progress, so also
        // how much is written) and for a page. A published post's date is
        // the one that matters, so it shows nothing more.
        (p.modified && !p.orphan && (p.draft || kind === 'page')
          ? '<div class="ecard-meta ecard-progress">Edited ' + ago(p.modified) +
            (p.draft ? ' &middot; ' + plural(p.words || 0, 'word') : '') + '</div>'
          : '') +
        (tags ? '<div class="post-tags">' + tags + '</div>' : '') +
        '</div>';
    }
    const section = (label, cards, empty) =>
      (label ? '<h2 class="sec">' + label + '</h2>' : '') + '<div class="ecards">' +
      (cards.length ? cards.join('') : '<div class="ecard empty">' + empty + '</div>') + '</div>';

    // The footer's numbers: what's published, what's still in draft, and the
    // standalone pages. Shown under both views, from the same listing.
    const plural = (k, w) => k + ' ' + w + (k === 1 ? '' : 's');
    function showStats({ posts, pages }) {
      const drafts = posts.filter(p => p.draft && !p.orphan).length;
      const published = posts.filter(p => !p.draft && !p.orphan).length;
      $('stats').innerHTML =
        '<b>' + plural(published, 'post') + '</b> published &middot; ' +
        '<b>' + drafts + '</b> in draft' +
        (pages.length ? ' &middot; <b>' + plural(pages.length, 'page') + '</b>' : '');
    }

    async function showHome() {
      $('home').hidden = false;
      const all = await listAll();
      showStats(all);
      const { posts, pages, unpushed } = all;
      const drafts = posts.filter(p => p.draft && !p.orphan);
      const published = posts.filter(p => !p.draft && !p.orphan);
      const orphans = posts.filter(p => p.orphan);
      // Published posts lead, untitled — they are the blog. Pages follow
      // under their own heading, then drafts.
      let h = section('', published.map(p => card(p, 'post', unpushed)),
                      'No posts yet — start one with the + button.');
      if (pages.length) h += section('Pages', pages.map(p => card(p, 'page', unpushed)));
      // A rule before the drafts: everything above it is on the blog,
      // everything below is still being written.
      if (drafts.length) h += '<hr class="sec-divider">' +
                              section('Drafts', drafts.map(p => card(p, 'post', unpushed)));
      // Orphaned cards: on the blog page with no file behind them. Not
      // documents to edit — opening one only offers Delete.
      if (orphans.length) h += section('Orphaned cards', orphans.map(p => card(p, 'post', unpushed)));
      // Feeds: pages this server fills in on its own (YouTube Likes, weekly).
      h += '<hr class="sec-divider">' + section('Feeds', [feedCard(await feedStatus())]);
      $('homebody').innerHTML = h;
    }

    // The YouTube Likes mirror: server.py runs it weekly and on "Sync now";
    // /api/youtube-likes says where it stands. Rendered as a card so the
    // dashboard shows the whole site, including the parts nobody types.
    const feedStatus = () => fetch('/api/youtube-likes').then(r => r.json())
      .catch(() => ({ configured: false, error: 'server unreachable' }));
    function feedCard(s) {
      const badges = [];
      if (!s.configured) badges.push('<span class="badge off">Not set up</span>');
      else if (s.last_error) badges.push('<span class="badge err">Last sync failed</span>');
      if (s.auto_push) badges.push('<span class="badge unpushed">Auto-push</span>');
      const meta = s.configured
        ? (s.count ? '<b>' + plural(s.count, 'video') + '</b>' +
                     (s.updated ? ' &middot; updated ' + humanDate(s.updated) : '')
                   : 'Nothing mirrored yet')
        : 'Run <code>.github/scripts/youtube_auth.py</code> once to connect your account';
      const when = !s.configured ? ''
        : s.running ? 'Syncing now…'
        : s.last_run ? 'Last sync ' + ago(s.last_run) + (s.last_trigger === 'timer' ? ' (weekly timer)' : '') +
                       ' &middot; next ' + humanDate(s.next_due.slice(0, 10))
        : 'Never synced — runs on its own within a minute of starting';
      return '<div class="ecard" id="feed-yt">' +
        '<a class="ecard-link" href="/youtube-likes/" aria-label="Open the YouTube Likes page"></a>' +
        (badges.length ? '<div class="badges">' + badges.join('') + '</div>' : '') +
        '<h2>YouTube Likes</h2>' +
        '<div class="ecard-meta">' + meta + '</div>' +
        (when ? '<div class="ecard-meta ecard-progress">' + when + '</div>' : '') +
        '<div class="feed-actions">' +
          '<button type="button" id="ytsync"' + (s.configured && !s.running ? '' : ' disabled') + '>Sync now</button>' +
          '<span class="feed-msg' + (s.last_error ? ' err' : '') + '">' +
            (s.last_error ? esc(s.last_error) : '') + '</span>' +
        '</div></div>';
    }
    // One handler on the dashboard body: the card is re-rendered after each
    // sync, so binding to the button itself would be lost.
    $('homebody').addEventListener('click', async e => {
      const b = e.target.closest('#ytsync'); if (!b) return;
      b.disabled = true; b.textContent = 'Syncing…';
      const msg = b.nextElementSibling; msg.className = 'feed-msg'; msg.textContent = '';
      let s;
      try {
        s = await fetch('/api/youtube-likes/sync', { method: 'POST' }).then(r => r.json());
      } catch (err) { s = { error: String(err) }; }
      if (s.error) s = { ...(await feedStatus()), last_error: s.error };
      $('feed-yt').outerHTML = feedCard(s);
      if (!s.error && !s.last_error) {
        const m = $('feed-yt').querySelector('.feed-msg');
        m.textContent = s.changed ? 'Updated: ' + plural(s.count, 'video') + ', ' + s.new + ' new' +
                                    (s.pushed ? ', pushed' : ' — git push to publish')
                                  : 'No change';
      }
    });

    // Open a post slug, routing to openOrphan when the server lists that slug
    // as an orphaned card rather than a real file — the ?p= URL can't tell
    // the two apart on its own.
    async function openPost(slug, push) {
      const { posts } = await fetch('/api/posts').then(r => r.json()).catch(() => ({ posts: [] }));
      const o = (posts || []).find(p => p.slug === slug && p.orphan);
      if (o) return openOrphan(slug, o.title, o.listed);
      return loadDoc('post', slug, push);
    }

    if (route === 'home') {
      showHome();
    } else {
      document.body.classList.add('editing');
      $('editor').hidden = false;
      listAll().then(showStats);
      if (route === 'page') loadDoc('page', params.get('page'), false);
      else if (route === 'post') openPost(params.get('p'), false);
      // 'new': the blank editor, as it stands.
    }

    // Save, answering the one question the server can't decide alone: a retitled
    // post wants to move to the filename its new title slugifies to, but if the
    // post is already pushed, that move 404s a URL the world may hold. Unpushed
    // posts move silently — the server only asks when it's a published one.
    async function postSave(url, payload) {
      const send = body => fetch(url, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      }).then(async r => [r, await r.json()]);

      let [r, d] = await send(payload);
      if (!r.ok && d.needs_choice) {
        const rename = confirm(
          'This post is already published at /blog/' + d.from + '.html, and the new ' +
          'title would put it at /blog/' + d.to + '.html.\n\n' +
          'OK — rename it. The URL matches the title, but /blog/' + d.from +
          '.html goes dead: any link or push notification pointing there breaks.\n\n' +
          'Cancel — keep the published URL. Only the title and its listing card change.');
        [r, d] = await send({ ...payload, rename: rename ? 'new' : 'keep' });
      }
      if (!r.ok) throw new Error(d.error || r.status);
      return d;
    }

    $('save').addEventListener('click', async () => {
      const title = $('title').value.trim();
      if (!title) { $('status').textContent = 'Add a title first.'; $('title').focus(); return; }
      if (currentOrphan) {
        // Saving here would write a brand-new, empty post at the orphan's slug
        // rather than restore anything — the markdown only ever lived in the
        // file that's gone. Delete the card, or start a fresh post instead.
        $('status').textContent =
          'That\'s an orphaned card, not a post — its file is gone, so there\'s nothing ' +
          'to save. Delete clears the card; New post starts a fresh one.';
        return;
      }
      const isPage = $('ispage').checked;
      // A tag typed but never committed — "Books" still sitting in the input
      // when Save is clicked — would otherwise be dropped silently. Blur is
      // the wrong place to catch it (it would also commit tags you typed and
      // thought better of); this is the one moment the text has to count.
      if (!isPage && cleanTag($('tagin').value)) addTag($('tagin').value);
      hideMenu();
      $('status').textContent = 'Saving…';
      try {
        // Both kinds send the open doc's slug: a page's pins its filename, a
        // post's tells the server which file a retitle is moving away from.
        const payload = isPage
          ? { title, slug: (currentKind === 'page' ? currentSlug : ''),
              markdown: $('md').value, html: toBody($('md').value) }
          : { title, date: $('date').value,
              slug: (currentKind === 'post' ? currentSlug : ''),
              draft: $('isdraft').checked, tags, layout: $('layout').value,
              markdown: $('md').value, html: toBody($('md').value) };
        const d = await postSave(isPage ? '/api/save-page' : '/api/save', payload);
        currentKind = isPage ? 'page' : 'post';
        currentSlug = d.slug;
        syncDelete();
        $('status').innerHTML = 'Saved &rarr; <a href="' + d.url + '" target="_blank">' +
                                d.url + '</a>' +
                                (d.renamed_from ? ' &middot; renamed from <code>blog/' +
                                                  d.renamed_from + '.html</code>' : '') +
                                (d.draft ? ' &middot; <b>draft</b> — listed as &ldquo;Coming soon&rdquo;'
                                         : '') +
                                (d.layout === 'gallery' ? ' &middot; gallery layout' : '') +
                                ' &middot; now <code>git push</code>';
        history.replaceState(null, '', '?' + (isPage ? 'page' : 'p') + '=' + d.slug);
        dirty = false;
        if (!isPage) loadKnownTags();
        listAll().then(showStats);
      } catch (e) { $('status').textContent = 'Error: ' + e.message; }
    });

    // Delete the open post. The usual reason: saving re-slugs the filename from
    // the title, so retitling a post leaves the old slug's file (and its card)
    // orphaned — open the stale one from the picker and delete it here.
    $('del').addEventListener('click', async () => {
      if (!canDelete()) return;
      const slug = currentSlug, title = $('title').value.trim() || slug;
      $('status').textContent = 'Checking…';
      try {
        const plan = await api('/api/post/delete-plan', { slug });
        // Either half can be missing: no file but a card left over is an orphan,
        // and clearing that card is the whole job. Only both missing is nothing.
        if (!plan.exists && !plan.cards)
          throw new Error('no file at ' + plan.target + ' and no card in the blog listing');
        let msg = 'Delete “' + title + '”?\n\n' +
                  (plan.exists ? '• DELETE the file ' + plan.target + '\n' : '') +
                  (plan.cards ? '• remove its card from the blog listing'
                              : '• (no card is in the listing)');
        if (!plan.exists)
          msg += '\n\nThe file ' + plan.target + ' is already gone, so this only clears ' +
                 'the stale card — which currently shows on the blog page as a post ' +
                 'that\'s "coming soon".';
        if (plan.inbound.length)
          msg += '\n\nWARNING: still linked from ' + plan.inbound.length + ' page(s):\n    ' +
                 plan.inbound.join('\n    ') + '\n  Those links will go dead — fix them by hand.';
        msg += '\n\nImages under /blog/images are kept (the renamed post may still ' +
               'use them).\nThis cannot be undone, except via git.';
        if (!confirm(msg)) { $('status').textContent = 'Kept ' + plan.target; return; }

        const d = await api('/api/post/delete', { slug });
        currentSlug = '';
        currentOrphan = false;
        dirty = false;                            // deleted; nothing to warn about
        const note = (d.deleted_file
                        ? 'Deleted <code>' + d.target + '</code>' +
                          (d.cards ? ' and its card' : ' (no card was in the listing)')
                        : 'Cleared the stale card for <code>' + d.target + '</code>') +
                     (d.pruned.length
                        ? ' &middot; also swept ' + d.pruned.length + ' other orphaned card(s): ' +
                          d.pruned.map(c => '<code>' + c.slug + '</code>').join(', ')
                        : '') +
                     ' &middot; commit &amp; <code>git push</code> to publish the removal';
        // Leave the editor on a blank post with the note; the dashboard, one
        // click away, no longer lists what was deleted.
        $('title').value = '';
        $('md').value = '';
        $('date').value = new Date().toISOString().slice(0, 10);
        $('isdraft').checked = false;
        $('layout').value = 'standard';
        setTags([]);
        setKind('post');
        render();
        history.replaceState(null, '', '?new=1');
        $('status').innerHTML = note;
        listAll().then(showStats);
      } catch (e) { $('status').textContent = 'Delete failed: ' + e.message; }
    });

    // Cmd/Ctrl+S saves, instead of the browser's "Save page…" dialog. Delegates
    // to the Save button so the post/page logic lives in one place.
    document.addEventListener('keydown', e => {
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 's') {
        e.preventDefault();
        $('save').click();
      }
    });

    // Unsaved edits: warn before any way out — New post, the header links, a
    // closed tab. The browser shows its own wording; the flag is enough.
    window.addEventListener('beforeunload', e => {
      if (dirty) { e.preventDefault(); e.returnValue = ''; }
    });
  </script>
</body>
</html>
