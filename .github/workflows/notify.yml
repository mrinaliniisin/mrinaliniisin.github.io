name: Notify subscribers of new cards

# Fires when any tracked page changes on main (see PAGES in
# notify_new_cards.py). The script diffs each page's items against the
# previous commit and pushes a notification for any new one, scoped to that
# page's own topic. secret.html itself isn't tracked — its old page-wide bell
# was retired in favor of per-card bells pointing at each destination's own
# topic (blog, commonplace, listicles, tvplotmaps).
on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "blog/index.html"
      - "commonplace/index.html"
      - "theo/listicles/index.html"
      - "tv-plot-maps/index.html"

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2          # need HEAD~1 to diff the cards
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Broadcast new cards
        env:
          PUSH_WORKER_URL: ${{ secrets.PUSH_WORKER_URL }}
          BROADCAST_SECRET: ${{ secrets.BROADCAST_SECRET }}
        run: python3 .github/scripts/notify_new_cards.py
