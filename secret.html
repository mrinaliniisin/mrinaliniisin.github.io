<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mrinalini S</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
           background: #f4f3f0; color: #1a1a1a; line-height: 1.5; padding: 64px 16px; }
    .wrap { max-width: 880px; margin: 0 auto; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 16px; }
    .card { display: block; background: white; border: 1px solid #d9d6cf;
            border-radius: 12px; padding: 24px; text-decoration: none; color: inherit;
            position: relative; overflow: hidden; min-height: 168px;
            transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease; }
    .card:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,0.06);
                  border-color: #2d5a27; }
    .card h2 { font-size: 20px; font-weight: 600; margin-bottom: 6px; }
    .card:hover h2 { color: #2d5a27; }
    .card .desc { font-size: 14px; color: #4a4540; }

    /* Stretched-link pattern: overlay makes the whole card clickable while
       letting the credit line and source link keep their own independent links. */
    .card-link { position: absolute; inset: 0; z-index: 1; }
    .credit { position: relative; z-index: 2; margin-top: 12px;
              font-size: 12px; color: #6b6560; }
    .credit a { color: #2d5a27; text-decoration: underline; }

    /* "View source on GitHub" icon-button: sits after the description and
       layers above the stretched card link so it stays independently clickable. */
    .gh { position: relative; z-index: 2; display: inline-flex;
          align-items: center; justify-content: center;
          width: 30px; height: 30px; margin-top: 14px; margin-left: -6px;
          border-radius: 8px; color: #a8a29e;
          transition: color 0.15s ease, background 0.15s ease; }
    .gh:hover { color: #2d5a27; background: #eceae4; }
    .gh svg { width: 18px; height: 18px; display: block; }
    /* Multi-link card: no stretched .card-link overlay, since the card has
       several destinations (and one entry with none), so each item links
       for itself. */
    .items { list-style: none; margin-top: 10px; font-size: 14px; color: #4a4540; }
    .items li { margin-top: 6px; }
    .items a { color: #2d5a27; text-decoration: underline;
               text-underline-offset: 2px; }
    footer { margin-top: 48px; font-size: 12px; color: #a8a29e; text-align: center; }
    footer a { color: inherit; text-decoration: underline; text-underline-offset: 2px; }
    .top-actions { position: fixed; top: 18px; right: 18px; z-index: 50;
                   display: flex; gap: 10px; }
    .icon-btn { width: 42px; height: 42px; padding: 0; cursor: pointer;
                display: inline-flex; align-items: center; justify-content: center;
                background: #fff; color: #1a1a1a; border: 1px solid #d9d6cf;
                border-radius: 50%; text-decoration: none;
                transition: background 0.15s ease, color 0.15s ease,
                            border-color 0.15s ease, transform 0.15s ease; }
    .icon-btn svg { width: 20px; height: 20px; display: block; }
    .icon-btn:hover { border-color: #1a1a1a; transform: translateY(-1px); }
    .notify-btn:disabled { opacity: 0.5; cursor: default; transform: none; }
    /* Subscribed: invert to a filled black bell — stays black & white. */
    .notify-btn[data-on="1"] { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }

    /* Per-card bell: smaller than the page-level icon-btn, pinned to a
       card's top-right corner, above the card's stretched-link overlay. Cards
       carrying one reserve right-side room in the title so long titles (e.g.
       "My Commonplace Book") wrap clear of the bell instead of running
       under it. */
    .card .card-bell { position: absolute; top: 14px; right: 14px; z-index: 2;
                        width: 32px; height: 32px; }
    .card .card-bell svg { width: 16px; height: 16px; }
    .card:has(.card-bell) h2 { padding-right: 40px; }
  </style>
</head>
<body>
  <div class="top-actions">
    <a class="icon-btn ig-link" href="https://instagram.com/mrinaliniisin"
       target="_blank" rel="noopener"
       aria-label="@mrinaliniisin on Instagram" title="@mrinaliniisin on Instagram">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="2" y="2" width="20" height="20" rx="5" ry="5"/>
        <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/>
        <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/>
      </svg>
    </a>
  </div>
  <div class="wrap">
    <div class="grid">
      <div class="card">
        <a class="card-link" href="blog/" aria-label="Blog"></a>
        <button class="icon-btn notify-btn card-bell" disabled
                data-bell-topic="blog" data-bell-scope="/blog/" data-bell-url="/blog/"
                data-bell-label="Get notified of new content!"
                aria-label="Get notified of new content!" title="Get notified of new content!">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
          </svg>
        </button>
        <h2>Blog</h2>
        <div class="desc">Notes, essays, and assorted writing.</div>
      </div>
      <div class="card">
        <a class="card-link" href="theo/listicles/index.html" aria-label="Listicles"></a>
        <button class="icon-btn notify-btn card-bell" disabled
                data-bell-topic="listicles" data-bell-scope="/theo/listicles/" data-bell-url="/theo/listicles/"
                data-bell-label="Get notified of new content!"
                aria-label="Get notified of new content!" title="Get notified of new content!">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
          </svg>
        </button>
        <h2>Listicles</h2>
        <div class="desc">See Mrinalini's most recommended every day objects.</div>
        <div class="credit">Made by <a href="https://github.com/mrinaliniisin/theo" target="_blank" rel="noopener">Theo</a></div>
      </div>
    </div>

    <footer>&copy; 2026 Mrinalini S &middot; <a href="upi://pay?pa=mrinalinis@upi&amp;pn=Mrinalini%20S&amp;cu=INR" title="Pay via UPI (opens a payment app on mobile)"><code>mrinalinis@upi</code></a> &middot; Code licensed under MIT</footer>
  </div>
  <script src="/bell.js" defer></script>
</body>
</html>
