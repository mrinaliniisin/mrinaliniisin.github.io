<svg viewBox="0 0 820 470" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="0" y="0" width="820" height="470" rx="14" fill="#FBF9F7"/>

  <text x="24" y="38" font-size="18" font-weight="700" fill="#2A2A32">Your pattern — Mirena + perimenopause</text>
  <text x="24" y="56" font-size="11" fill="#8A8792">Timing is approximate — the whole cycle stretches or compresses month to month.</text>

  <!-- gridlines -->
  <g stroke="#E6E2DC" stroke-width="1">
    <line x1="190" y1="72" x2="190" y2="392"/>
    <line x1="321.1" y1="72" x2="321.1" y2="392"/>
    <line x1="474" y1="72" x2="474" y2="392"/>
    <line x1="627" y1="72" x2="627" y2="392"/>
    <line x1="780" y1="72" x2="780" y2="392"/>
  </g>
  <g font-size="10" fill="#8A8792" text-anchor="middle">
    <text x="190" y="86">~Day 1</text><text x="321.1" y="86">~Day 7</text>
    <text x="474" y="86">~Day 14</text><text x="627" y="86">~Day 21</text><text x="780" y="86">~Day 28</text>
  </g>

  <!-- SECTION A: underlying -->
  <text x="24" y="106" font-size="10" font-weight="700" fill="#9A8FA6" letter-spacing="0.5">UNDERLYING — OFTEN STILL RUNNING, UNSEEN</text>

  <text x="24" y="130" font-size="12" font-weight="700" fill="#2A2A32">Follicular</text>
  <rect x="190" y="116" width="262" height="28" rx="6" fill="#5BA88A"/>
  <text x="321" y="135" font-size="10" font-weight="600" fill="#FFFFFF" text-anchor="middle">building</text>

  <text x="24" y="168" font-size="12" font-weight="700" fill="#2A2A32">Ovulation</text>
  <rect x="452" y="154" width="44" height="28" rx="6" fill="#E0A32E" fill-opacity="0.55" stroke="#E0A32E" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="500" y="172" font-size="9" fill="#C08A1E" text-anchor="start">often, not always (perimenopause)</text>

  <text x="24" y="206" font-size="12" font-weight="700" fill="#2A2A32">Luteal</text>
  <rect x="496" y="192" width="284" height="28" rx="6" fill="#8B6DA8"/>
  <text x="638" y="211" font-size="10" font-weight="600" fill="#FFFFFF" text-anchor="middle">progesterone up, then drops →</text>

  <line x1="24" y1="238" x2="796" y2="238" stroke="#E6E2DC" stroke-width="1"/>

  <!-- SECTION B: what you feel & see -->
  <text x="24" y="260" font-size="10" font-weight="700" fill="#9A8FA6" letter-spacing="0.5">WHAT YOU ACTUALLY FEEL &amp; SEE</text>

  <!-- Mood / energy -->
  <text x="24" y="286" font-size="12" font-weight="700" fill="#2A2A32">Mood / energy</text>
  <text x="24" y="298" font-size="9" fill="#8A8792">felt, not seen</text>
  <!-- lift -->
  <rect x="430" y="274" width="66" height="28" rx="6" fill="#5BA88A" fill-opacity="0.45" stroke="#5BA88A" stroke-width="1.1" stroke-dasharray="4 3"/>
  <text x="463" y="292" font-size="9" font-weight="600" fill="#3E7C63" text-anchor="middle">lift</text>
  <!-- dip + rage -->
  <rect x="670" y="274" width="110" height="28" rx="6" fill="#C0435A" fill-opacity="0.55" stroke="#C0435A" stroke-width="1.2"/>
  <text x="725" y="292" font-size="9.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">dip + rage crest</text>

  <!-- Spotting -->
  <text x="24" y="330" font-size="12" font-weight="700" fill="#2A2A32">Spotting</text>
  <text x="24" y="342" font-size="9" fill="#8A8792">breakthrough, variable</text>
  <!-- variability range dashed -->
  <rect x="714" y="316" width="66" height="28" rx="6" fill="#B8B2AA" fill-opacity="0.30" stroke="#B8B2AA" stroke-width="1.1" stroke-dasharray="4 3"/>
  <!-- core spot solid -->
  <rect x="758" y="316" width="22" height="28" rx="6" fill="#9A5060"/>
  <text x="714" y="366" font-size="9" fill="#8A6470" text-anchor="start">1 day → 3–4 days (patchy shedding, not a true period)</text>

  <!-- sequence arrow annotation -->
  <text x="620" y="386" font-size="9" fill="#8A8792" text-anchor="start">rage crest → spot within ~a day → relief as next follicular rises</text>

  <!-- footer caveats -->
  <line x1="24" y1="404" x2="796" y2="404" stroke="#E6E2DC" stroke-width="1"/>
  <text x="24" y="424" font-size="10" fill="#6E6A74">• No true withdrawal period — the lining is kept thin, so it sheds in patches, not one coordinated bleed.</text>
  <text x="24" y="440" font-size="10" fill="#6E6A74">• Sequence is stable even when spacing isn't: the order holds, the calendar dates drift.</text>
  <text x="24" y="456" font-size="10" fill="#6E6A74">• The rage is progesterone-withdrawal chemistry (brake off), not a verdict about your life — it lifts in days.</text>
</svg>
